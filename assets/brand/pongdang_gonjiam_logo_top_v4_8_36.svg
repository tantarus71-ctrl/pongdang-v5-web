<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">퐁당퐁당 곤지암천</title>
  <desc id="desc">퐁당퐁당은 크게, 곤지암천은 작게 배치한 어린이용 물방울 스타일 투명 배경 로고</desc>
  <defs>
    <linearGradient id="waterBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67edff"/>
      <stop offset="0.46" stop-color="#13bce6"/>
      <stop offset="1" stop-color="#1260d6"/>
    </linearGradient>
    <linearGradient id="deepBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d78db"/>
      <stop offset="1" stop-color="#0b3d9d"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-18%" width="125%" height="145%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#053b86" flood-opacity="0.34"/>
    </filter>
    <filter id="smallShadow" x="-12%" y="-18%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#082c68" flood-opacity="0.25"/>
