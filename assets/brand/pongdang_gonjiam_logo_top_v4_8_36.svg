    <text x="654" y="137" font-family="Noto Sans KR, Arial Rounded MT Bold, sans-serif" font-size="56" font-weight="900" letter-spacing="-4" fill="none" stroke="#073b91" stroke-width="8" stroke-linejoin="round">곤지암천</text>
    <text x="654" y="137" font-family="Noto Sans KR, Arial Rounded MT Bold, sans-serif" font-size="56" font-weight="900" letter-spacing="-4" fill="url(#deepBlue)">곤지암천</text>
