  </defs>
  <g filter="url(#softShadow)">
    <text x="34" y="140" font-family="Arial Black, Noto Sans KR, sans-serif" font-size="132" font-weight="900" letter-spacing="-9" fill="none" stroke="#ffffff" stroke-width="30" stroke-linejoin="round">퐁당퐁당</text>
    <text x="34" y="140" font-family="Arial Black, Noto Sans KR, sans-serif" font-size="132" font-weight="900" letter-spacing="-9" fill="none" stroke="#073b91" stroke-width="15" stroke-linejoin="round">퐁당퐁당</text>
    <text x="34" y="140" font-family="Arial Black, Noto Sans KR, sans-serif" font-size="132" font-weight="900" letter-spacing="-9" fill="url(#waterBlue)" stroke="#0a67c4" stroke-width="3" stroke-linejoin="round">퐁당퐁당</text>
    <path d="M97 40 C104 18 125 8 137 27 C148 45 126 61 111 71 C101 78 91 61 97 40Z" fill="#30d6ff" stroke="#ffffff" stroke-width="6"/>
    <path d="M52 66 C31 56 23 76 37 91 C50 104 68 87 82 76 C73 71 64 70 52 66Z" fill="#4ee6ff" stroke="#ffffff" stroke-width="5"/>
