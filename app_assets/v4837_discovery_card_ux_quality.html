      margin: 0;
      width: 100%;

<body>
  <main>
    <h1>v30A1 실행 준비 중</h1>
    <p>인앱 캐시를 정리하고 최신 기준본으로 이동합니다.</p>
    <p><a id="fallback" href="./pongdang_gonjiam_v30A1_audio_stability_final/index.html">직접 열기</a></p>
  </main>
  <script>
    (async () => {
      const target = './pongdang_gonjiam_v30A1_audio_stability_final/index.html?inapp=v30A1&cache=' + Date.now();
      document.getElementById('fallback').href = target;
      try {
        sessionStorage.clear();
        localStorage.removeItem('PondangV5DiscoveryCardUXV4837');
      } catch (e) {}
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      } catch (e) {}
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => reg.unregister()));
        }
      } catch (e) {}
      location.replace(target);
    })();
  </script>
