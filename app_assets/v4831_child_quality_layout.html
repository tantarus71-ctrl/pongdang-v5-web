0 auto;border:1px solid #daf7ff44;border-radius:999px;background:#062a42bb;color:#eaffff;font-weight:900;font-size:12px;padding:8px 11px}.zones button.on{background:linear-gradient(#2adced,#0a9bcc);box-shadow:0 8px 18px #00c6e633}.fx{position:absolute;inset:0;pointer-events:none}.light{position:absolute;inset:-20%;opacity:.28;background:linear-gradient(110deg,transparent 35%,#c8f5ff55 45%,transparent 58%);animation:light 8s infinite alternate}@keyframes light{to{transform:translate(4%,2%) rotate(2deg)}}.plant{position:absolute;bottom:-8px;width:30px;height:165px;background:linear-gradient(#7be09b,#126a48);border-radius:100% 0;opacity:.62;animation:sway 6s infinite alternate;transform-origin:bottom}.p1{left:4%}.p2{right:7%;height:190px}.p3{left:82%;height:135px;opacity:.45}@keyframes sway{to{transform:rotate(5deg)}}.bubble{position:absolute;left:var(--x);bottom:-20px;width:var(--s);height:var(--s);border:1px solid #eaffffbb;border-radius:50%;animation:bub var(--d) linear infinite;animation-delay:var(--delay)}@keyframes bub{to{transform:translate(var(--m),-110vh);opacity:0}}.fishLayer{position:absolute;inset:0;z-index:4;pointer-events:none}.fish{position:absolute;left:var(--x);top:var(--y);width:var(--w);aspect-ratio:240/104;animation:swim var(--dur) ease-in-out infinite alternate;filter:var(--f);opacity:var(--o);pointer-events:none;will-change:margin,filter}.fish img,.fish svg{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 8px 14px #0006)}.front{--f:saturate(1.18) brightness(1.12);--o:1;cursor:pointer;pointer-events:auto}.mid{--f:blur(.25px) saturate(.98);--o:.86}.back{--f:blur(1.2px) saturate(.82);--o:.58}.rev img,.rev svg{transform:scaleX(-1)}@keyframes swim{0%{margin-left:-8px;margin-top:-4px}50%{margin-left:18px;margin-top:7px}100%{margin-left:-4px;margin-top:-6px}}.card{position:absolute;z-index:12;left:12px;right:12px;bottom:92px;border-radius:24px;padding:12px;display:grid;grid-template-columns:72px 1fr;gap:11px;align-items:center ementById('fx'),fl=document.getElementById('fishLayer'),h=document.getElementById('hint'),ic=document.getElementById('icon'),nm=document.getElementById('nm'),tx=document.getElementById('tx'),rp=document.getElementById('rp'),report=document.getElementById('report');let asset={loaded:0,fallback:0};const fish=[['beodeulchi','버들치','웃물·여울','6~10cm',8,34,116,.86,13,'맑은 물을 좋아하는 대표 친구예요. 앞쪽으로 오면 눌러서 살펴봐요.'],['pirami','피라미','여울','7~13cm',58,42,92,.66,10,'반짝이며 빠르게 움직이는 여울 친구예요.',1],['swiri','쉬리','자갈 바닥','8~12cm',22,64,82,.56,15,'돌 사이를 지나가는 친구예요.'],['gaksi','각시붕어','잔여울·수초','4~6cm',42,53,88,.78,12,'수초 곁에서 천천히 반짝이는 친구예요.']];let seen=new Set();function say(t){h.textContent=t;h.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>h.style.opacity=0,1600)}function svg(s){let[id,n,z,sz,x,y,w,dur,dep,text,rev]=s;let colors=id==='pirami'?['#f7fbff','#9ed7ff','#ff9359','#2f5b84']:id==='gaksi'?['#fff2c5','#ff9f85','#88d3ff','#d46a82']:id==='swiri'?['#f1e0b4','#9a7f53','#5a4a36','#7b5736']:['#ecf6e7','#a4c085','#68855d','#6d7f55'];return `<svg viewBox="0 0 240 104"><defs><linearGradient id="g${id}" x1="0" x2="1"><stop stop-color="${colors[0]}"/><stop offset=".55" stop-color="${colors[1]}"/><stop offset="1" stop-color="${colors[2]}"/></linearGradient></defs><path d="M18 51C50 15 113 7 163 24c21 7 39 19 55 34-17 15-36 27-61 33C103 105 51 83 18 51Z" fill="url(#g${id})"/><path d="M170 29l56-27c-14 29-14 64 1 94l-57-30Z" fill="${colors[2]}"/><path d="M48 55c34-7 82-6 135 6" fill="none" stroke="${colors[3]}" stroke-width="6" stroke-linecap="round" opacity=".6"/><ellipse cx="48" cy="42" rx="7" ry="7" fill="#102338"/><circle cx="46" cy="40" r="2.2" fill="#fff"/><path d="M80 18c18-11 49-12 78-1" fill="none" stroke="#fff" stroke-width="6" opacity=".32" stroke-linecap="round"/></svg>`}function markup(s,kind){let id=s[0];if(id==='beodeulchi'||id==='pirami')return `<img src="${AS}${id}/${kind}.svg" alt="${s[1]}" data-asset="${id}-${kind}">`;return svg(s)}function bind(host,s){host.querySelectorAll
