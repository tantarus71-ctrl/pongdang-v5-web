<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>퐁당퐁당 수족관 QA 확인</title>
  <style>
    body{margin:0;background:#061d2d;color:#eefcff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif}.wrap{max-width:980px;margin:0 auto;padding:20px}.card{border:1px solid rgba(190,240,255,.22);background:rgba(10,38,58,.86);border-radius:22px;padding:16px;margin:12px 0}h1{margin:0 0 8px;font-size:28px}h2{margin:0 0 12px;font-size:18px}p{color:#a9cedc;line-height:1.55}.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;border:1px solid rgba(190,240,255,.22);background:rgba(102,217,255,.12);color:#eefcff;text-decoration:none;border-radius:14px;padding:11px 13px;font-weight:900}.item{display:block;margin:8px 0;padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.04)}code,pre{background:rgba(0,0,0,.28);border-radius:12px;color:#d6f7ff}code{padding:2px 5px}pre{padding:12px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style>
</head>
<body>
  <main class="wrap">
    <h1>퐁당퐁당 수족관 QA 확인</h1>
    <p>아래 링크로 현재 작업본을 열고, 체크리스트와 콘솔 명령으로 수족관 레이어·버들치 depth 상태를 확인합니다.</p>

    <section class="card">
      <h2>확인 링크</h2>
      <div class="btns">
        <a class="btn" href="./index.html?cache=qa-aquarium" target="_blank">앱 화면 열기</a>
        <a class="btn" href="./admin-preview.html?cache=qa-aquarium" target="_blank">관리자 preview 열기</a>
      </div>
    </section>

    <section class="card">
      <h2>콘솔 확인 명령</h2>
      <p>앱 화면을 연 뒤 브라우저 개발자도구 콘솔에서 아래 명령을 실행하세요.</p>
      <pre>window.PondangAquariumDepthV1?.audit()
window.PondangFishDepthTuneV1?.audit()
window.PondangUtmulDayQ88Override</pre>
    </section>

    <section class="grid">
      <div class="card">
        <h2>수족관 체크</h2>
        <label class="item"><input type="checkbox"> 첫 화면이 정상 로드된다.</label>
        <label class="item"><input type="checkbox"> 웃물 낮 q88 배경이 보인다.</label>
        <label class="item"><input type="checkbox"> 수초·돌·거품이 과하지 않다.</label>
        <label class="item"><input type="checkbox"> 작은 생물이 너무 튀지 않는다.</label>
        <label class="item"><input type="checkbox"> 물고기 클릭이 막히지 않는다.</label>
      </div>
      <div class="card">
        <h2>존/야간 체크</h2>
        <label class="item"><input type="checkbox"> 웃물은 맑고 얕게 보인다.</label>
        <label class="item"><input type="checkbox"> 여울은 흐름감은 있으나 과하게 번쩍이지 않는다.</label>
        <label class="item"><input type="checkbox"> 잔여울은 수초가 풍부하나 복잡하지 않다.</label>
        <label class="item"><input type="checkbox"> 깊물은 깊지만 너무 어둡지 않다.</label>
        <label class="item"><input type="checkbox"> 물모이는 풍성하지만 정신없지 않다.</label>
        <label class="item"><input type="checkbox"> 밤 모드가 은은하고 LED처럼 보이지 않는다.</label>
      </div>
    </section>

    <section class="card">
      <h2>기능 체크</h2>
      <label class="item"><input type="checkbox"> 탐사 버튼 정상</label>
      <label class="item"><input type="checkbox"> 도감 버튼 정상</label>
      <label class="item"><input type="checkbox"> 미션 버튼 정상</label>
      <label class="item"><input type="checkbox"> 카메라 버튼 정상</label>
      <label class="item"><input type="checkbox"> 음성 버튼 정상</label>
      <label class="item"><input type="checkbox"> 관리자 preview에서 backgrounds 10개와 utmul_day q88 path 확인</label>
    </section>
  </main>
</body>
</html>
