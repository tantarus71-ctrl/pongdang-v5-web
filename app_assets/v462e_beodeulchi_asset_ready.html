<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>퐁당퐁당 V5 v4.6.2e 버들치 자산 연결</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06131f;color:#f4fbff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.app{width:100vw;height:100dvh;background:radial-gradient(circle at 50% 0,#36a8d8,#082d45 52%,#03131f);overflow:hidden}.phone{position:relative;width:min(100vw,520px);height:100%;margin:0 auto;overflow:hidden;background:#08263b}.aq{position:absolute;inset:0;background:linear-gradient(#61cce850,#04486d99 40%,#021625);overflow:hidden}.aq:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 105%,#7d5c40aa,transparent 35%),radial-gradient(ellipse at 80% 105%,#37583aaa,transparent 35%)}.top{position:absolute;z-index:10;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.brand,.chip,.card,.report{background:rgba(4,28,48,.78);border:1px solid rgba(218,247,255,.30);box-shadow:0 12px 28px #0005;backdrop-filter:blur(12px)}.brand{border-radius:18px;padding:10px 13px}.brand b{font-size:15px}.brand small{display:block;color:#bde9ff;font-size:11px}.chip{border:0;border-radius:99px;background:#92e3ffe6;color:#05263d;font-weight:900;padding:10px 11px}.fx{position:absolute;inset:0;pointer-events:none}.light{position:absolute;inset:-20%;opacity:.25;background:linear-gradient(110deg,transparent 35%,#c8f5ff44 45%,transparent 58%);animation:light 8s infinite alternate}@keyframes light{to{transform:translate(4%,2%) rotate(2deg)}}.plant{position:absolute;bottom:-8px;width:28px;height:160px;background:linear-gradient(#7be09b,#126a48);border-radius:100% 0;opacity:.65;animation:sway 6s infinite alternate;transform-origin:bottom}.p1{left:4%}.p2{right:7%;height:190px}.p3{left:82%;height:135px;opacity:.45}@keyframes sway{to{transform:rotate(5deg)}}.bubble{position:absolute;left:var(--x);bottom:-20px;width:var(--s);height:var(--s);border:1px solid #eaffffbb;border-radius:50%;animation:bub var(--d) linear infinite;animation-delay:var(--delay)}@keyframes bub{to{transform:translate(var(--m),-110vh);opacity:0}}.fishLayer{position:absolute;inset:115px 14px 178px;z-index:4;pointer-events:none;overflow:hidden;border-radius:26px}.fish{position:absolute;left:var(--x);top:var(--y);width:var(--w);aspect-ratio:240/104;animation:swim var(--dur) ease-in-out infinite alternate;filter:var(--f);opacity:var(--o);pointer-events:none}.fish img,.fish svg{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 8px 14px #0006)}.front{--f:saturate(1.18) brightness(1.12);--o:1;cursor:pointer;pointer-events:auto}.mid{--f:blur(.3px);--o:.86}.back{--f:blur(1.3px) saturate(.8);--o:.58}.rev img,.rev svg{transform:scaleX(-1)}@keyframes swim{0%{margin-left:-8px;margin-top:-4px}50%{margin-left:20px;margin-top:7px}100%{margin-left:-4px;margin-top:-6px}}.card{position:absolute;left:14px;right:14px;bottom:92px;z-index:6;border-radius:22px;padding:12px;display:grid;grid-template-columns:74px 1fr;gap:11px}.icon{height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(160deg,#91e1ff55,#ffe47030);overflow:hidden}.icon img,.icon svg{width:88px;height:42px;object-fit:contain}.info b{font-size:15px}.info p{margin:4px 0 0;color:#d4f2ff;font-size:12px;line-height:1.45}.hint{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);z-index:7;opacity:0;transition:.2s;max-width:80vw;border-radius:99px;padding:8px 13px;background:#041c30d0;border:1px solid #daf7ff44;font-size:12px;font-weight:850;text-align:center}.dock{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(96vw,520px);height:64px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px;border-radius:24px;background:#041c30dd;border:1px solid #daf7ff44;backdrop-filter:blur(14px)}.dock button{border:1px solid #fff7;border-radius:18px;background:linear-gradient(145deg,#92e3ff,#2f9ee8);font-weight:950;color:#05263d;display:flex;align-items:center;justify-content:center;gap:5px}.emoji{font-size:22px}.label{font-size:12px}.zone{position:absolute;top:76px;left:14px;right:14px;display:flex;gap:6px;z-index:8;flex-wrap:wrap}.zone span{font-size:11px;font-weight:850;border-radius:99px;padding:7px 10px;background:#041c3099;border:1px solid #daf7ff44}.report{display:none;position:absolute;top:116px;left:14px;right:14px;z-index:9;border-radius:20px;padding:14px}.show{display:block}.food{position:absolute;z-index:7;width:7px;height:7px;border-radius:50%;background:#ffd65c;left:var(--x);top:15%;animation:food 2.3s forwards;pointer-events:none}@keyframes food{to{transform:translateY(60vh);opacity:0}}@media(max-width:420px){.dock{height:60px}.label{font-size:11px}.emoji{font-size:20px}.card{grid-template-columns:66px 1fr;bottom:88px}.zone{display:none}.hint{bottom:162px}.fishLayer{inset:104px 12px 170px}}</style></head><body><div class="app"><div class="phone"><section class="aq" id="aq"><div class="fx" id="fx"><div class="light"></div><i class="plant p1"></i><i class="plant p2"></i><i class="plant p3"></i></div><div class="fishLayer" id="fishLayer"></div></section><header class="top"><div class="brand"><b>퐁당퐁당 V5</b><small>버들치 자산 연결 안정화본</small></div><button class="chip" id="audit">검수</button></header><div class="zone"><span>웃물</span><span>여울</span><span>잔여울</span><span>깊물</span></div><div class="report" id="report"><b>관찰 보고서</b><p id="rp">버들치 자산 연결 상태를 확인합니다.</p></div><div class="hint" id="hint">천천히 관찰해요.</div><article class="card"><div class="icon" id="icon"></div><div class="info"><b id="nm">버들치</b><p id="tx">실제 자산 경로가 연결된 첫 번째 물고기예요.</p></div></article></div></div><nav class="dock"><button data-m="explore"><span class="emoji">🧭</span><span class="label">탐험</span></button><button data-m="book"><span class="emoji">📖</span><span class="label">도감</span></button><button data-m="friend"><span class="emoji">🐟</span><span class="label">친구</span></button><button data-m="report"><span class="emoji">📋</span><span class="label">보고서</span></button></nav><script>(()=>{const AS='../assets/fish/';const fx=document.getElementById('fx'),fl=document.getElementById('fishLayer'),h=document.getElementById('hint'),ic=document.getElementById('icon'),nm=document.getElementById('nm'),tx=document.getElementById('tx'),rp=document.getElementById('rp'),report=document.getElementById('report'),aq=document.getElementById('aq');let asset={loaded:0,fallback:0};const fish=[['beodeulchi','버들치','웃물·여울','6~10cm',8,36,112,.84,13,'맑은 물을 좋아하는 대표 친구예요. 실제 연결 자산으로 먼저 확인합니다.'],['pirami','피라미','여울','7~13cm',58,42,88,.66,10,'다음 교체 예정 친구예요.',1],['swiri','쉬리','자갈 바닥','8~12cm',22,62,82,.56,15,'돌 사이를 지나가는 친구예요.'],['gaksi','각시붕어','잔여울·수초','4~6cm',42,52,88,.78,12,'수초 곁의 작은 친구예요.']];let seen=new Set(['beodeulchi']);function say(t){h.textContent=t;h.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>h.style.opacity=0,1600)}function svg(s){return `<svg viewBox="0 0 240 104"><defs><linearGradient id="g${s[0]}" x1="0" x2="1"><stop stop-color="#ecf6e7"/><stop offset=".55" stop-color="#a4c085"/><stop offset="1" stop-color="#68855d"/></linearGradient></defs><path d="M18 51C50 15 113 7 163 24c21 7 39 19 55 34-17 15-36 27-61 33C103 105 51 83 18 51Z" fill="url(#g${s[0]})"/><path d="M170 29l56-27c-14 29-14 64 1 94l-57-30Z" fill="#68855d"/><path d="M48 55c34-7 82-6 135 6" fill="none" stroke="#6d7f55" stroke-width="6" stroke-linecap="round" opacity=".6"/><ellipse cx="48" cy="42" rx="7" ry="7" fill="#102338"/><circle cx="46" cy="40" r="2.2" fill="#fff"/></svg>`}function imageOrSvg(s,kind){if(s[0]==='beodeulchi'){return `<img src="${AS}beodeulchi/${kind}.svg" alt="버들치" data-asset="beodeulchi-${kind}">`}return svg(s)}function bindFallback(host,s){host.querySelectorAll('img[data-asset]').forEach(img=>{img.onload=()=>asset.loaded++;img.onerror=()=>{asset.fallback++;img.replaceWith(document.createRange().createContextualFragment(svg(s)))};img.draggable=false})}function bubbles(){if(fx.dataset.ready)return;fx.dataset.ready=1;for(let i=0;i<18;i++){let b=document.createElement('i');b.className='bubble';b.style.setProperty('--x',4+Math.random()*92+'%');b.style.setProperty('--s',3+Math.random()*6+'px');b.style.setProperty('--d',5+Math.random()*6+'s');b.style.setProperty('--delay',-Math.random()*8+'s');b.style.setProperty('--m',(Math.random()*32-16)+'px');fx.appendChild(b)}}function draw(){fl.innerHTML='';fish.forEach(s=>{let dep=s[7],e=document.createElement('div');e.className='fish '+(dep>=.72?'front clickable':dep>=.6?'mid':'back')+(s[10]?' rev':'');e.style.cssText=`--x:${s[4]}%;--y:${s[5]}%;--w:${s[6]}px;--dur:${s[8]}s`;e.innerHTML=imageOrSvg(s,'swim');bindFallback(e,s);e.onclick=()=>{if(!e.classList.contains('clickable'))return;select(s);flash(e)};fl.appendChild(e)});select(fish[0])}function select(s){seen.add(s[0]);ic.innerHTML=imageOrSvg(s,'card');bindFallback(ic,s);nm.textContent=s[1]+' · '+s[2];tx.textContent=s[3]+' · '+s[9];rp.textContent='발견한 친구 '+seen.size+'종 · '+[...seen].map(id=>fish.find(x=>x[0]==id)[1]).join(', ')+' · 자산 loaded '+asset.loaded+' / fallback '+asset.fallback;say(s[1]+' 관찰 카드가 열렸어요.')}function flash(e){e.style.filter='saturate(1.3) brightness(1.2) drop-shadow(0 0 16px #ffe060aa)';setTimeout(()=>e.style.filter='',900)}function feed(){for(let i=0;i<9;i++){let f=document.createElement('i');f.className='food';f.style.setProperty('--x',38+Math.random()*24+'%');aq.appendChild(f);setTimeout(()=>f.remove(),2400)}document.querySelectorAll('.front,.mid').forEach((e,i)=>setTimeout(()=>flash(e),i*120));say('가까이 온 친구들이 반응해요.')}document.querySelectorAll('.dock button').forEach(b=>b.onclick=()=>{let m=b.dataset.m;if(m==='friend')feed();if(m==='report'){report.classList.toggle('show');rp.textContent='자산 loaded '+asset.loaded+' / fallback '+asset.fallback}if(m==='explore')say('앞쪽으로 오는 버들치를 찾아봐요.');if(m==='book')say('버들치 자산 연결 카드가 준비됐어요.')});document.getElementById('audit').onclick=()=>say(PondangV5BeodeulchiAssetReadyV462e.audit().ok?'검수 통과':'점검 필요');window.PondangV5BeodeulchiAssetReadyV462e={audit(){let p=[];if(document.querySelectorAll('.fish').length<4)p.push('물고기 부족');if(!document.querySelector('img[data-asset="beodeulchi-swim"]'))p.push('버들치 swim 자산 미연결');if(!document.querySelector('img[data-asset="beodeulchi-card"]'))p.push('버들치 card 자산 미연결');return{version:'v4.6.2e',ok:p.length===0,fishCount:document.querySelectorAll('.fish').length,assetLoaded:asset.loaded,assetFallback:asset.fallback,problems:p}},run(){return this.audit()},triggerFeeding:feed};bubbles();draw();setTimeout(()=>console.log(PondangV5BeodeulchiAssetReadyV462e.audit()),700)})();</script></body></html>
