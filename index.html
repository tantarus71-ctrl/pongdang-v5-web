<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>퐁당퐁당 V5 v4.6.2c 안정화</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06131f;color:#f4fbff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none}.app{width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 0,#39a8d4,#08304a 48%,#03131f)}.phone{position:relative;width:min(100vw,520px);height:100%;margin:0 auto;overflow:hidden;background:#08263b}.aq{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#61cce850,#04486d99 40%,#021625)}.aq:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 105%,#7d5c40aa,transparent 35%),radial-gradient(ellipse at 80% 105%,#37583aaa,transparent 35%);pointer-events:none}.top{position:absolute;z-index:10;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.brand,.chip,.card,.report{background:rgba(4,28,48,.78);border:1px solid rgba(218,247,255,.30);box-shadow:0 12px 28px #0005;backdrop-filter:blur(12px)}.brand{border-radius:18px;padding:10px 13px}.brand b{font-size:15px}.brand small{display:block;color:#bde9ff;font-size:11px}.chip{border-radius:99px;color:#05263d;background:#92e3ffe6;border:0;font-weight:900;padding:10px 11px;touch-action:manipulation}.zone{position:absolute;top:76px;left:14px;right:14px;z-index:8;display:flex;gap:6px;flex-wrap:wrap}.zone span{font-size:11px;font-weight:850;border-radius:99px;padding:7px 10px;background:#041c3099;border:1px solid #daf7ff44}.fx{position:absolute;inset:0;z-index:1;pointer-events:none}.light{position:absolute;inset:-20%;opacity:.25;background:linear-gradient(110deg,transparent 35%,#c8f5ff44 45%,transparent 58%);animation:light 8s infinite alternate}@keyframes light{to{transform:translate(4%,2%) rotate(2deg)}}.bubble{position:absolute;left:var(--x);bottom:-20px;width:var(--s);height:var(--s);border:1px solid #eaffffbb;border-radius:50%;animation:bub var(--d) linear infinite;animation-delay:var(--delay)}@keyframes bub{to{transform:translate(var(--m),-110vh);opacity:0}}.plant{position:absolute;bottom:-8px;width:28px;height:160px;background:linear-gradient(#7be09b,#126a48);border-radius:100% 0;opacity:.65;animation:sway 6s infinite alternate;transform-origin:bottom}.p1{left:4%}.p2{right:7%;height:190px}.p3{left:82%;height:135px;opacity:.45}@keyframes sway{to{transform:rotate(5deg)}}.fishLayer{position:absolute;inset:0;z-index:3;pointer-events:none}.fish{position:absolute;left:var(--x);top:var(--y);width:var(--w);aspect-ratio:240/104;animation:swim var(--dur) ease-in-out infinite alternate;filter:var(--f);opacity:var(--o);pointer-events:none;will-change:margin,filter,opacity}.fish svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 14px #0006)}.rev svg{transform:scaleX(-1)}.front{--f:saturate(1.18) brightness(1.12);--o:1;cursor:pointer;pointer-events:auto}.mid{--f:blur(.3px);--o:.86}.back{--f:blur(1.3px) saturate(.8);--o:.58}@keyframes swim{0%{margin-left:-8px;margin-top:-4px}50%{margin-left:20px;margin-top:7px}100%{margin-left:-4px;margin-top:-6px}}.card{position:absolute;left:14px;right:14px;bottom:92px;z-index:6;border-radius:22px;padding:12px;display:grid;grid-template-columns:74px 1fr;gap:11px}.icon{height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(160deg,#91e1ff55,#ffe47030);overflow:hidden}.icon svg{width:88px}.info b{font-size:15px}.info p{margin:4px 0 0;color:#d4f2ff;font-size:12px;line-height:1.45}.hint{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);z-index:7;opacity:0;transition:.2s;max-width:80vw;border-radius:99px;padding:8px 13px;background:#041c30d0;border:1px solid #daf7ff44;font-size:12px;font-weight:850;text-align:center}.dock{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(96vw,520px);height:64px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px;border-radius:24px;background:#041c30dd;border:1px solid #daf7ff44;backdrop-filter:blur(14px)}.dock button{border:1px solid #fff7;border-radius:18px;background:linear-gradient(145deg,#92e3ff,#2f9ee8);font-weight:950;color:#05263d;display:flex;align-items:center;justify-content:center;gap:5px;touch-action:manipulation}.emoji{font-size:22px}.label{font-size:12px}.report{display:none;position:absolute;top:116px;left:14px;right:14px;z-index:9;border-radius:20px;padding:14px}.show{display:block}@keyframes food{to{transform:translateY(60vh);opacity:0}}.food{position:absolute;z-index:7;width:7px;height:7px;border-radius:50%;background:#ffd65c;left:var(--x);top:15%;animation:food 2.3s forwards;pointer-events:none}@media(max-width:420px){.dock{height:60px}.label{font-size:11px}.emoji{font-size:20px}.card{grid-template-columns:66px 1fr;bottom:88px}.zone{display:none}.hint{bottom:162px}}@media(prefers-reduced-motion:reduce){.fish,.bubble,.plant,.light,.food{animation-duration:.01ms!important;animation-iteration-count:1!important}}</style></head><body><div class="app"><div class="phone"><section class="aq" id="aq"><div class="fx" id="fx"><div class="light"></div><i class="plant p1"></i><i class="plant p2"></i><i class="plant p3"></i></div><div class="fishLayer" id="fishLayer"></div></section><header class="top"><div class="brand"><b>퐁당퐁당 V5</b><small>안정화된 최종 물고기 친구들</small></div><button class="chip" id="audit">검수</button></header><div class="zone"><span>웃물</span><span>여울</span><span>잔여울</span><span>깊물</span></div><div class="report" id="report"><b>관찰 보고서</b><p id="rp">앞쪽 물고기를 눌러보세요.</p></div><div class="hint" id="hint">천천히 관찰해요.</div><article class="card"><div class="icon" id="icon"></div><div class="info"><b id="nm">버들치</b><p id="tx">맑은 여울에서 천천히 헤엄치는 대표 친구예요.</p></div></article></div></div><nav class="dock"><button data-m="explore"><span class="emoji">🧭</span><span class="label">탐험</span></button><button data-m="book"><span class="emoji">📖</span><span class="label">도감</span></button><button data-m="friend"><span class="emoji">🐟</span><span class="label">친구</span></button><button data-m="report"><span class="emoji">📋</span><span class="label">보고서</span></button></nav><script>(()=>{const fx=document.getElementById('fx'),fl=document.getElementById('fishLayer'),h=document.getElementById('hint'),ic=document.getElementById('icon'),nm=document.getElementById('nm'),tx=document.getElementById('tx'),rp=document.getElementById('rp'),report=document.getElementById('report'),aq=document.getElementById('aq');const sp=[['beodeulchi','버들치','웃물·여울','6~10cm','#ecf6e7','#a4c085','#68855d','#6d7f55',7,35,110,.84,13,'맑은 물을 좋아하는 대표 친구예요. 연한 줄무늬를 살펴봐요.'],['pirami','피라미','여울','7~13cm','#f7fbff','#9ed7ff','#ff9359','#2f5b84',58,42,88,.66,10,'반짝이며 무리 지어 움직이는 빠른 친구예요.',1],['swiri','쉬리','자갈 바닥','8~12cm','#f1e0b4','#9a7f53','#5a4a36','#7b5736',22,62,82,.56,15,'돌 사이로 숨었다가 빠르게 나오는 친구예요.'],['gaksi','각시붕어','잔여울·수초','4~6cm','#fff2c5','#ff9f85','#88d3ff','#d46a82',42,52,88,.78,12,'수초 옆에서 천천히 움직이며 반짝이는 작은 친구예요.'],['rare','서리비늘','희귀 출몰','상상어종','#e9fbff','#b5dfff','#e7d6ff','#8da9ff',70,24,66,.48,18,'가끔 흐릿하게 나타나는 특별 친구예요.',1]];let seen=new Set(['beodeulchi']);function say(t){h.textContent=t;h.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>h.style.opacity=0,1600)}function svg(s){let[id,n,z,sz,a,b,c,l]=s;return `<svg viewBox="0 0 240 104"><defs><linearGradient id="g${id}" x1="0" x2="1"><stop stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><path d="M18 51C50 15 113 7 163 24c21 7 39 19 55 34-17 15-36 27-61 33C103 105 51 83 18 51Z" fill="url(#g${id})"/><path d="M170 29l56-27c-14 29-14 64 1 94l-57-30Z" fill="${c}"/><path d="M48 55c34-7 82-6 135 6" fill="none" stroke="${l}" stroke-width="6" stroke-linecap="round" opacity=".6"/><ellipse cx="48" cy="42" rx="7" ry="7" fill="#102338"/><circle cx="46" cy="40" r="2.2" fill="#fff"/><path d="M80 18c18-11 49-12 78-1" fill="none" stroke="#fff" stroke-width="6" opacity=".34" stroke-linecap="round"/></svg>`}function bubbles(){if(fx.dataset.ready)return;fx.dataset.ready=1;for(let i=0;i<20;i++){let b=document.createElement('i');b.className='bubble';b.style.setProperty('--x',4+Math.random()*92+'%');b.style.setProperty('--s',3+Math.random()*6+'px');b.style.setProperty('--d',5+Math.random()*6+'s');b.style.setProperty('--delay',-Math.random()*8+'s');b.style.setProperty('--m',(Math.random()*32-16)+'px');fx.appendChild(b)}}function draw(){fl.innerHTML='';sp.forEach(s=>{let e=document.createElement('div'),dep=s[11];e.className='fish '+(dep>=.72?'front clickable':dep>=.6?'mid':'back')+(s[14]?' rev':'');e.style.cssText=`--x:${s[8]}%;--y:${s[9]}%;--w:${s[10]}px;--scale:${(.7+dep*.58).toFixed(2)};--dur:${s[12]}s`;e.innerHTML=svg(s);e.onclick=()=>{if(!e.classList.contains('clickable'))return;select(s);flash(e)};fl.appendChild(e)});select(sp[0])}function select(s){seen.add(s[0]);ic.innerHTML=svg(s);nm.textContent=s[1]+' · '+s[2];tx.textContent=s[3]+' · '+s[13];rp.textContent='발견한 친구 '+seen.size+'종 · '+[...seen].map(id=>sp.find(x=>x[0]==id)[1]).join(', ');say(s[1]+' 관찰 카드가 열렸어요.')}function flash(e){e.style.filter='saturate(1.3) brightness(1.2) drop-shadow(0 0 16px #ffe060aa)';setTimeout(()=>e.style.filter='',900)}function feed(){for(let i=0;i<10;i++){let f=document.createElement('i');f.className='food';f.style.setProperty('--x',38+Math.random()*24+'%');aq.appendChild(f);setTimeout(()=>f.remove(),2400)}document.querySelectorAll('.front,.mid').forEach((e,i)=>setTimeout(()=>flash(e),i*120));say('가까이 온 친구들이 반응해요.')}document.querySelectorAll('.dock button').forEach(b=>b.onclick=()=>{let m=b.dataset.m;if(m==='friend')feed();if(m==='report')report.classList.toggle('show');if(m==='explore')say('앞쪽으로 오는 물고기를 찾아봐요.');if(m==='book')say('도감 카드로 생김새를 비교해요.')});document.getElementById('audit').onclick=()=>say(PondangV5StableFishDesignV462c.audit().ok?'검수 통과':'점검 필요');window.PondangV5StableFishDesignV462c={audit(){let p=[];if(document.querySelectorAll('.fish').length<5)p.push('물고기 부족');if(document.querySelectorAll('.dock button').length!==4)p.push('메뉴 오류');if(!document.querySelector('.front'))p.push('앞쪽 물고기 없음');if(!document.querySelector('.card'))p.push('도감 카드 없음');return{version:'v4.6.2c',ok:p.length===0,fishCount:document.querySelectorAll('.fish').length,menuCount:document.querySelectorAll('.dock button').length,problems:p}},run(){return this.audit()},triggerFeeding:feed};bubbles();draw();setTimeout(()=>console.log(PondangV5StableFishDesignV462c.audit()),300)})();</script></body></html>
