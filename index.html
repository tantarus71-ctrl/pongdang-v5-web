<!doctype html>

<style>
:root{--safe-bottom:max(10px,env(safe-area-inset-bottom));--dock-h:76px;--text:#f2fbff;--blue1:#85ddff;--blue2:#2a9be8}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06131f;color:var(--text);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}button{font:inherit}.app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 0%,#176b95 0,#08263e 52%,#03131f 100%)}.phone{position:relative;width:min(100vw,520px);height:100%;margin:0 auto;overflow:hidden;background:#061a2a;box-shadow:0 0 70px rgba(0,0,0,.36)}.aquariumStage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,rgba(88,197,230,.26),rgba(4,49,75,.65) 42%,rgba(2,25,38,.92));isolation:isolate}.aquariumStage:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.20),transparent 23%),linear-gradient(180deg,rgba(255,255,255,.10),transparent 28%,rgba(0,0,0,.14));pointer-events:none}.topbar{position:absolute;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));z-index:50;display:flex;gap:8px;align-items:center;justify-content:space-between}.brand{padding:10px 13px;border-radius:18px;background:rgba(3,24,40,.64);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px)}.brand b{font-size:15px}.brand small{display:block;font-size:11px;color:#bfecff;margin-top:2px}.chip{border:0;border-radius:999px;padding:10px 12px;background:rgba(133,221,255,.88);color:#06263a;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.22)}.waterLayer{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}.caustic{position:absolute;inset:-20%;opacity:.24;mix-blend-mode:screen;background:radial-gradient(ellipse at 22% 12%,rgba(255,255,255,.22),transparent 34%),radial-gradient(ellipse at 74% 18%,rgba(255,255,255,.16),transparent 28%),linear-gradient(110deg,transparent 0 35%,rgba(173,235,255,.18) 45%,transparent 58% 100%);animation:lightDrift 8s ease-in-out infinite alternate}@keyframes lightDrift{from{transform:translate3d(-2%,-1%,0) rotate(-1deg)}to{transform:translate3d(2%,1%,0) rotate(1deg)}}.bubble{position:absolute;width:var(--b,5px);height:var(--b,5px);left:var(--x,50%);bottom:-16px;border-radius:999px;border:1px solid rgba(225,250,255,.7);background:rgba(220,250,255,.14);opacity:.62;animation:bubbleRise var(--d,7s) linear infinite;animation-delay:var(--delay,0s)}@keyframes bubbleRise{from{transform:translate3d(0,0,0) scale(.75);opacity:.05}15%{opacity:.62}to{transform:translate3d(var(--drift,14px),-112vh,0) scale(1.18);opacity:0}}.dust{position:absolute;width:2px;height:2px;left:var(--x,50%);top:var(--y,50%);border-radius:50%;background:rgba(255,255,255,.35);opacity:.28;animation:dustFloat var(--d,12s) ease-in-out infinite alternate}@keyframes dustFloat{from{transform:translate3d(-6px,3px,0)}to{transform:translate3d(8px,-5px,0)}}.fishLayer{position:absolute;inset:0;z-index:12;pointer-events:none}.fish{position:absolute;width:var(--size,92px);height:calc(var(--size,92px)*.42);left:var(--x,20%);top:var(--y,40%);transform:scale(var(--scale,1));filter:var(--filter);opacity:var(--op,1);pointer-events:none;animation:swim var(--dur,14s) ease-in-out infinite alternate;will-change:transform,left,top,filter}.fish svg{width:100%;height:100%;display:block;filter:drop-shadow(0 7px 12px rgba(0,0,0,.25))}.fish.reverse svg{transform:scaleX(-1)}@keyframes swim{0%{margin-left:-6px;margin-top:-3px}35%{margin-left:18px;margin-top:6px}70%{margin-left:-12px;margin-top:2px}100%{margin-left:10px;margin-top:-6px}}.fish.front{--filter:saturate(1.18) brightness(1.12);--op:1;pointer-events:auto;cursor:pointer}.fish.mid{--filter:blur(.35px) saturate(.96) brightness(.96);--op:.84}.fish.back{--filter:blur(1.4px) saturate(.82) brightness(.82);--op:.58}.fish.clickable{filter:saturate(1.25) brightness(1.18) drop-shadow(0 0 12px rgba(255,233,112,.55));pointer-events:auto}.food{position:absolute;left:var(--x,50%);top:var(--y,18%);width:7px;height:7px;border-radius:50%;background:radial-gradient(circle,#ffe897,#d89131);box-shadow:0 0 10px rgba(255,213,92,.45);z-index:20;pointer-events:none;animation:foodFall 2.4s ease-in forwards}@keyframes foodFall{from{transform:translate3d(0,-4px,0) scale(1);opacity:1}to{transform:translate3d(var(--dx,0px),62vh,0) scale(.55);opacity:0}}.hint{position:absolute;left:50%;bottom:calc(var(--dock-h) + var(--safe-bottom) + 10px);transform:translateX(-50%);z-index:80;max-width:min(78vw,420px);padding:9px 13px;border-radius:999px;background:rgba(4,28,48,.82);color:#f2fbff;border:1px solid rgba(215,247,255,.28);font-weight:850;font-size:13px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.22);opacity:0;transition:opacity .18s ease}.dock{position:fixed;left:50%;bottom:calc(8px + var(--safe-bottom));transform:translateX(-50%);width:min(96vw,520px);height:64px;z-index:90;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:7px;border-radius:24px;background:linear-gradient(180deg,rgba(7,42,66,.86),rgba(3,22,38,.88));border:1px solid rgba(206,246,255,.28);box-shadow:0 16px 38px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(14px)}.dock button{appearance:none;border:1px solid rgba(255,255,255,.36);border-radius:18px;background:linear-gradient(145deg,var(--blue1),var(--blue2));color:#05263d;font-weight:950;letter-spacing:-.04em;display:flex;align-items:center;justify-content:center;gap:5px;min-width:0;min-height:48px;padding:5px 4px;box-shadow:0 8px 18px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.38);cursor:pointer;touch-action:manipulation}.dock button:active{transform:translateY(1px) scale(.985)}.emoji{font-size:22px}.label{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;line-height:1.05}.panel{position:absolute;z-index:70;left:14px;right:14px;bottom:calc(var(--dock-h) + var(--safe-bottom) + 48px);padding:14px;border-radius:20px;background:rgba(4,28,48,.82);border:1px solid rgba(215,247,255,.24);box-shadow:0 14px 32px rgba(0,0,0,.24);display:none}.panel.show{display:block}.panel h2{margin:0 0 6px;font-size:16px}.panel p{margin:0;color:#cdefff;font-size:13px;line-height:1.6}@media(max-width:420px){.dock{width:min(98vw,420px);height:60px;gap:5px;padding:6px}.dock button{min-height:46px;gap:3px}.emoji{font-size:20px}.label{font-size:11px}.brand b{font-size:14px}}@media(orientation:landscape) and (max-height:560px){.dock{height:52px;width:min(70vw,460px);bottom:calc(5px + var(--safe-bottom))}.dock button{min-height:38px}.emoji{font-size:18px}.label{font-size:10.5px}.topbar{top:6px}.brand{padding:7px 10px}.panel{bottom:64px}}
</style></head><body>
<div class="app"><div class="phone"><section class="aquariumStage" id="aquariumStage"><div class="waterLayer"><div class="caustic"></div></div><div class="fishLayer" id="fishLayer"></div></section><header class="topbar"><div class="brand"><b>퐁당퐁당 V5</b><small>곤지암천 2.5D 관찰 수족관</small></div><button class="chip" id="auditBtn">검수</button></header><div class="panel" id="infoPanel"><h2 id="panelTitle">도감</h2><p id="panelText">가까이 온 물고기를 살펴보고, 생김새와 움직임을 천천히 관찰해요.</p></div><div class="hint" id="softHint">눈으로만 천천히 관찰해요.</div></div></div>
<nav class="dock" id="pondangV5BottomDockV462a"><button data-menu="book" aria-label="도감"><span class="emoji">📖</span><span class="label">도감</span></button><button data-menu="explore" aria-label="탐사"><span class="emoji">🧭</span><span class="label">탐사</span></button><button data-menu="mission" aria-label="미션"><span class="emoji">⭐</span><span class="label">미션</span></button><button data-menu="feed" aria-label="먹이주기"><span class="emoji">🫙</span><span class="label">먹이주기</span></button></nav>
<script>
(function(){'use strict';const stage=document.getElementById('aquariumStage'),fishLayer=document.getElementById('fishLayer'),hint=document.getElementById('softHint'),panel=document.getElementById('infoPanel'),title=document.getElementById('panelTitle'),text=document.getElementById('panelText');const PROFILE={version:'v4.6.2a',frontDepth:.72,features:['하단 4메뉴','앞쪽 물고기 클릭','2.5D 깊이감','먹이 반응','터치 반응','기포·빛줄기·먼지']};function showHint(t){hint.textContent=t;hint.style.opacity='1';clearTimeout(showHint.t);showHint.t=setTimeout(()=>hint.style.opacity='0',1600)}function fishSVG(color='#d9f2ef',line='#9fbf91'){return `<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg"><path d="M18 43C47 13 105 7 151 22c18 6 33 16 46 29-15 12-31 22-52 27C95 88 47 72 18 43Z" fill="${color}"/><path d="M160 26l49-23c-12 25-12 55 1 80l-50-25Z" fill="#b4c9a4"/><path d="M45 46c31-6 73-5 119 5" fill="none" stroke="${line}" stroke-width="5" stroke-linecap="round" opacity=".55"/><circle cx="42" cy="36" r="5" fill="#102336"/><path d="M68 24c17-10 46-12 70-2" fill="none" stroke="#fff" stroke-width="5" opacity=".35" stroke-linecap="round"/></svg>`}const fishData=[{x:8,y:34,size:96,depth:.82,dur:13,c:'#d8eee8',l:'#839b7c'},{x:58,y:41,size:74,depth:.63,dur:11,c:'#e9f7ff',l:'#8bb2c8',r:1},{x:24,y:61,size:68,depth:.55,dur:15,c:'#d9e8c7',l:'#84956e'},{x:70,y:24,size:58,depth:.46,dur:18,c:'#cfe7ee',l:'#7ba5b5',r:1},{x:42,y:52,size:86,depth:.76,dur:12,c:'#f1ead1',l:'#b6a05e'}];function makeEffects(){for(let i=0;i<20;i++){const b=document.createElement('i');b.className='bubble';b.style.setProperty('--x',(4+Math.random()*92).toFixed(2)+'%');b.style.setProperty('--b',(3+Math.random()*6).toFixed(1)+'px');b.style.setProperty('--d',(5.5+Math.random()*6).toFixed(2)+'s');b.style.setProperty('--delay',(-Math.random()*8).toFixed(2)+'s');b.style.setProperty('--drift',((Math.random()*32)-16).toFixed(1)+'px');stage.querySelector('.waterLayer').appendChild(b)}for(let i=0;i<42;i++){const d=document.createElement('i');d.className='dust';d.style.setProperty('--x',(Math.random()*100).toFixed(2)+'%');d.style.setProperty('--y',(Math.random()*100).toFixed(2)+'%');d.style.setProperty('--d',(8+Math.random()*14).toFixed(2)+'s');stage.querySelector('.waterLayer').appendChild(d)}}function renderFish(){fishLayer.innerHTML='';fishData.forEach(f=>{const el=document.createElement('div');el.className='fish '+(f.depth>=.72?'front clickable':f.depth>=.60?'mid':'back')+(f.r?' reverse':'');el.dataset.depth=f.depth;el.style.setProperty('--x',f.x+'%');el.style.setProperty('--y',f.y+'%');el.style.setProperty('--size',f.size+'px');el.style.setProperty('--scale',(0.72+f.depth*.55).toFixed(2));el.style.setProperty('--dur',f.dur+'s');el.innerHTML=fishSVG(f.c,f.l);el.addEventListener('click',e=>{if(!el.classList.contains('clickable'))return;e.stopPropagation();showHint('앞쪽으로 가까이 온 물고기예요.');flash(el)});fishLayer.appendChild(el)})}function flash(el){el.style.filter='saturate(1.25) brightness(1.18) drop-shadow(0 0 14px rgba(255,214,88,.62))';setTimeout(()=>{el.style.filter=''},900)}function feed(){for(let i=0;i<9;i++){const food=document.createElement('i');food.className='food';food.style.setProperty('--x',(38+Math.random()*24).toFixed(2)+'%');food.style.setProperty('--y',(12+Math.random()*12).toFixed(2)+'%');food.style.setProperty('--dx',((Math.random()*32)-16).toFixed(1)+'px');stage.appendChild(food);setTimeout(()=>food.remove(),2600)}document.querySelectorAll('.fish.front,.fish.mid').forEach((el,i)=>setTimeout(()=>flash(el),i*120));showHint('가까이 온 물고기에게만 먹이를 줘요.')}function startle(){document.querySelectorAll('.fish.front,.fish.mid').forEach((el,i)=>{if(i>1)return;const dx=i%2===0?18:-18;el.style.marginLeft=dx+'px';el.style.marginTop='-6px';setTimeout(()=>{el.style.marginLeft='';el.style.marginTop=''},380)})}function openPanel(kind){panel.classList.add('show');const map={book:['도감 📖','가까이 온 물고기의 생김새를 천천히 살펴봐요.'],explore:['탐사 🧭','물살, 돌, 수초, 작은 생물을 차례로 관찰해요.'],mission:['미션 ⭐','오늘은 앞쪽으로 온 물고기 한 마리를 찾아봐요.']};title.textContent=map[kind][0];text.textContent=map[kind][1];showHint(map[kind][1])}document.querySelectorAll('.dock button').forEach(btn=>btn.addEventListener('click',()=>{const k=btn.dataset.menu;if(k==='feed')feed();else openPanel(k)}));stage.addEventListener('pointerdown',e=>{if(e.target.closest('.fish'))return;startle()},{passive:true});document.getElementById('auditBtn').addEventListener('click',()=>showHint(PondangV5SafeMotionV462a.audit().ok?'검수 통과했어요.':'점검할 부분이 있어요.'));window.PondangV5SafeMotionV462a={profile:PROFILE,run(){return this.audit()},triggerFeeding:feed,audit(){const problems=[];if(document.querySelectorAll('.dock button').length!==4)problems.push('하단 메뉴 4개 아님');if(!document.querySelector('.caustic'))problems.push('빛줄기 없음');if(!document.querySelector('.bubble'))problems.push('기포 없음');if(!document.querySelector('.fish.front'))problems.push('앞쪽 물고기 없음');const result={version:PROFILE.version,ok:problems.length===0,menuCount:document.querySelectorAll('.dock button').length,fishCount:document.querySelectorAll('.fish').length,features:PROFILE.features,problems};console.log('[PondangV5SafeMotionV462a]',result);return result}};makeEffects();renderFish();setTimeout(()=>PondangV5SafeMotionV462a.audit(),300)})();
</script></body></html>
